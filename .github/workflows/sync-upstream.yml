name: Monthly sync with Divinum Officium

# Once a month: merge DivinumOfficium/divinum-officium into this fork, then
# rebuild the Matins corpus, text files and EPUB from the updated engine and
# texts. If the merge conflicts, or would change workflow files (which this
# job's token may not push), it opens an issue instead of pushing anything.
on:
  schedule:
    - cron: "41 4 3 * *"   # 3rd of each month, 04:41 UTC
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild the corpus even if Divinum Officium has no new commits"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'arathalion/divinum-officium-matins'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: matins-readings
          fetch-depth: 0

      - name: Merge Divinum Officium
        id: merge
        run: |
          git config user.name "matins-bot"
          git config user.email "matins-bot@users.noreply.github.com"
          git remote add upstream https://github.com/DivinumOfficium/divinum-officium.git
          git fetch -q upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with Divinum Officium."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/master; then
            git merge --abort || true
            gh issue create --title "Monthly sync: merge conflict with Divinum Officium" \
              --body "Merging DivinumOfficium/divinum-officium master ($(git rev-parse --short upstream/master)) into matins-readings conflicted, so nothing was pushed. Merge it by hand and run this workflow again."
            exit 1
          fi
          if git diff --name-only "$before" HEAD | grep -q '^\.github/workflows/'; then
            gh issue create --title "Monthly sync: Divinum Officium changed workflow files" \
              --body "The merge of DivinumOfficium/divinum-officium master ($(git rev-parse --short upstream/master)) changes files in .github/workflows, which this job is not allowed to push. Merge it by hand (git fetch upstream && git merge upstream/master), push, and run this workflow again."
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "summary=$(git log --oneline "$before"..upstream/master | wc -l | tr -d ' ') new Divinum Officium commits" >> "$GITHUB_OUTPUT"

      - name: Perl modules for the engine
        if: steps.merge.outputs.merged == 'true' || inputs.rebuild
        run: sudo apt-get update -q && sudo apt-get install -y -q libcgi-pm-perl

      - name: Rebuild the corpus, text files and EPUB
        if: steps.merge.outputs.merged == 'true' || inputs.rebuild
        run: |
          matins/tools/harvest_years.sh 1950 2100 > /dev/null
          (cd web/www/horas/Latin && ls Tempora/*.txt Sancti/*.txt Commune/*.txt) > matins/cache/allfiles.txt
          perl matins/tools/extract_files.pl < matins/cache/allfiles.txt > matins/cache/files.jsonl
          python3 matins/tools/build_corpus.py
          python3 matins/tools/build_epub.py

      - name: Commit and push
        if: steps.merge.outputs.merged == 'true' || inputs.rebuild
        run: |
          # The EPUB embeds a build time, so only take it when the readings changed.
          git add -A matins/text matins/data
          committed=false
          if git diff --cached --quiet; then
            echo "Rebuilt; the readings did not change."
            git checkout -- matins/output/Matins-Readings-1954.epub 2>/dev/null || true
          else
            git add matins/output/Matins-Readings-1954.epub
            git commit -q -m "Rebuild Matins readings after syncing with Divinum Officium" \
              -m "${{ steps.merge.outputs.summary || 'Manual rebuild' }}. $(git diff --cached --stat | tail -1)"
            committed=true
          fi
          # Push only when there is something new (a merge or a rebuild commit).
          if [ "${{ steps.merge.outputs.merged }}" = "true" ] || [ "$committed" = "true" ]; then
            git push origin HEAD:matins-readings
          fi
          # Keep the fork's master equal to Divinum Officium's.
          git push origin refs/remotes/upstream/master:refs/heads/master || echo "Could not update master (it may have diverged); left as is."
