name: Daily Matins readings

# Renders the next 60 days of Matins (email + web page) with the engine and
# publishes them to the `daily-data` branch, which the sending Worker reads.
# Then reads the newest days aloud for the podcast (Kokoro) and stores the
# episodes in Cloudflare R2. Scheduled runs only fire from the default branch.
#
# The engine is Divinum Officium's code, merged in from upstream, so the job
# that runs it has a read-only token and keeps no credentials. A separate job,
# which runs none of that code, checks its output and publishes it.
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC nightly
  workflow_dispatch:
    inputs:
      podcast_only:
        description: "Only render podcast episodes (skip the readings)"
        type: boolean
        default: false
      rerender:
        description: "Render the recent podcast episodes again (after a voice or text change)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-readings
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'arathalion/divinum-officium-matins' && !inputs.podcast_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Perl modules for the engine
        run: sudo apt-get update -q && sudo apt-get install -y -q libcgi-pm-perl

      - name: Render readings (yesterday + 60 days)
        run: |
          python3 matins/daily/build_daily.py \
            --start "$(date -u -d yesterday +%F)" --days 61 --out "$RUNNER_TEMP/daily"

      - uses: actions/upload-artifact@v4
        with:
          name: daily
          path: ${{ runner.temp }}/daily
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: daily
          path: ${{ runner.temp }}/daily

      - name: Check the rendered files
        # Only <calendar>/<lang>/<date>.json and manifest.json, and no links.
        run: |
          cd "$RUNNER_TEMP/daily"
          unexpected=$(find . -mindepth 1 \( -type f -o -type d \) -printf '%P\n' | grep -Ev \
            '^(manifest\.json|[a-z0-9-]{1,32}|[a-z0-9-]{1,32}/[a-z]{2}|[a-z0-9-]{1,32}/[a-z]{2}/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json)$' || true)
          other=$(find . -mindepth 1 ! -type f ! -type d -printf '%P\n')
          if [ -n "$unexpected$other" ]; then
            echo "Unexpected files in the rendered output:"; printf '%s\n' $unexpected $other
            exit 1
          fi
          echo "$(find . -type f | wc -l) files checked"

      - name: Publish to daily-data
        run: bash matins/daily/publish.sh "$RUNNER_TEMP/daily"

  podcast:
    # Separate from the readings, so a problem here never holds up the email.
    needs: publish
    if: always() && github.repository == 'arathalion/divinum-officium-matins' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      R2_ACCOUNT_ID: 4fdd6f78581627b29dddc8606767ce1e
      R2_BUCKET: matutinum
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kokoro voice model (cached)
        id: model
        uses: actions/cache@v4
        with:
          path: ~/kokoro-model
          key: kokoro-onnx-model-files-v1.0

      - name: Download the voice model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/kokoro-model
          for f in kokoro-v1.0.onnx voices-v1.0.bin; do
            curl -sSfL -o ~/kokoro-model/$f "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"
          done

      - name: Tools
        run: |
          pip install -q kokoro-onnx soundfile boto3
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Today's readings from the daily-data branch
        # Read straight from the branch: raw.githubusercontent.com can lag a few minutes.
        run: |
          git fetch -q --depth 1 origin daily-data
          mkdir -p "$RUNNER_TEMP/data"
          git archive FETCH_HEAD 1954/en | tar -x -C "$RUNNER_TEMP/data"

      - name: Render and upload episodes
        run: |
          python3 matins/podcast/render.py --models ~/kokoro-model --data "$RUNNER_TEMP/data" \
            ${{ inputs.rerender && '--replace' || '' }}
